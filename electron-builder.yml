appId: com.triagent.app
productName: TriAgent
copyright: Copyright © 2025 TriAgent
asar: false

files:
  - dist/electron/**/*
  - "!node_modules"

directories:
  output: release

win:
  target:
    - target: dir
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}.${ext}"

extraResources:
  - from: dist/python-worker
    to: python-worker
    filter:
      - "**/*"
